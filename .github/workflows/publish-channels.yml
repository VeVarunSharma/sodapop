name: Publish approved package channels

on:
  workflow_run:
    workflows: [Verify public native downloads]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: An already published, attested release version without v
        type: string
        required: true
      npm:
        description: Publish exact-version npm packages using configured OIDC
        type: boolean
        default: false
      homebrew:
        description: Open a reviewed version-update PR in the owned tap
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-channels-${{ github.event.workflow_run.head_branch || inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'release')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish_npm: ${{ steps.release.outputs.publish_npm }}
      publish_homebrew: ${{ steps.release.outputs.publish_homebrew }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      AUTOMATIC_TAG: ${{ github.event.workflow_run.head_branch }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_NPM: ${{ inputs.npm }}
      INPUT_HOMEBREW: ${{ inputs.homebrew }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve an approved public release and channel selection
        id: release
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            tag="$AUTOMATIC_TAG"
            version="${tag#v}"
            publish_npm=true
            publish_homebrew=false
          else
            tag="v$INPUT_VERSION"
            version="$INPUT_VERSION"
            publish_npm="$INPUT_NPM"
            publish_homebrew="$INPUT_HOMEBREW"
          fi
          if [[ "$tag" != "v$version" ||
                ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            printf 'An exact release tag with npm-compatible SemVer is required.\n' >&2
            exit 1
          fi
          metadata="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isImmutable,isPrerelease)"
          jq -e 'select(.isDraft == false and .isImmutable == true)' <<<"$metadata" >/dev/null
          if [[ "$publish_homebrew" == true ]] &&
            jq -e '.isPrerelease == true' <<<"$metadata" >/dev/null; then
            printf 'Homebrew publication requires a stable release.\n' >&2
            exit 1
          fi
          if [[ "$publish_npm" != true && "$publish_homebrew" != true ]]; then
            printf 'Select at least one channel to publish.\n' >&2
            exit 1
          fi
          gh release verify "$tag" --repo "$GITHUB_REPOSITORY"
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'publish_npm=%s\n' "$publish_npm"
            printf 'publish_homebrew=%s\n' "$publish_homebrew"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download and verify the approved bytes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          mkdir -p publication/release
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir publication/release \
            --pattern '*.tar.gz' --pattern '*.zip' --pattern '*.sha256' \
            --pattern "sodapop-$VERSION-manifest.json"
          manifest="publication/release/sodapop-$VERSION-manifest.json"
          gh release verify-asset "v$VERSION" "$manifest" --repo "$GITHUB_REPOSITORY"
          jq -e --arg version "$VERSION" --arg commit "$(git rev-parse HEAD)" \
            '.version == $version and .commit == $commit' "$manifest" >/dev/null
          go run ./scripts/releasectl verify --dir publication/release --manifest "$manifest"
      - name: Generate packages without rebuilding the application
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SODAPOP_HOMEBREW_RELEASE_DIR: ${{ github.workspace }}/publication/release
        run: |
          npm run build --prefix npm -- --version "$VERSION" \
            --release-dir "$GITHUB_WORKSPACE/publication/release" \
            --manifest "$GITHUB_WORKSPACE/publication/release/sodapop-$VERSION-manifest.json" \
            --output "$GITHUB_WORKSPACE/publication/npm"
          SODAPOP_HOMEBREW_MANIFEST="$GITHUB_WORKSPACE/publication/release/sodapop-$VERSION-manifest.json" \
            bash scripts/generate-homebrew-formula.sh "$VERSION" "$GITHUB_WORKSPACE/publication/homebrew/Formula/sodapop.rb"
      - uses: actions/upload-artifact@v4
        with:
          name: approved-channel-inputs
          path: publication/
          if-no-files-found: error
          retention-days: 7

  npm:
    if: needs.prepare.outputs.publish_npm == 'true'
    needs: prepare
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PUBLISH_ENABLED: ${{ vars.SODAPOP_NPM_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require npm publisher configuration
        shell: bash
        run: |
          if [[ "$PUBLISH_ENABLED" != true ]]; then
            printf 'Configure namespace ownership and OIDC before enabling npm publication.\n' >&2
            exit 1
          fi
      - name: Install the pinned OIDC-capable publishing CLI
        run: npm install --global npm@11.19.0 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: approved-channel-inputs
          path: publication
      - name: Publish identical platform tarballs before the launcher
        shell: bash
        run: |
          tag=latest
          if [[ "$VERSION" == *-* ]]; then tag=preview; fi
          node scripts/publish-npm.mjs "$GITHUB_WORKSPACE/publication/npm" "$VERSION" "$tag"

  homebrew:
    if: needs.prepare.outputs.publish_homebrew == 'true'
    needs: prepare
    runs-on: ubuntu-24.04
    environment: homebrew-publish
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      STABLE_QUALIFIED: ${{ vars.SODAPOP_STABLE_RELEASE_QUALIFIED }}
    steps:
      - name: Require a qualified stable release
        shell: bash
        run: |
          if [[ "$VERSION" == *-* || "$STABLE_QUALIFIED" != true ]]; then
            printf 'The stable Homebrew tap requires a qualified stable release.\n' >&2
            exit 1
          fi
      - uses: actions/create-github-app-token@v2
        id: tap-token
        with:
          app-id: ${{ vars.SODAPOP_HOMEBREW_APP_ID }}
          private-key: ${{ secrets.SODAPOP_HOMEBREW_APP_PRIVATE_KEY }}
          owner: VeVarunSharma
          repositories: homebrew-sodapop
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          repository: VeVarunSharma/homebrew-sodapop
          token: ${{ steps.tap-token.outputs.token }}
          persist-credentials: false
          path: tap
      - uses: actions/download-artifact@v4
        with:
          name: approved-channel-inputs
          path: publication
      - name: Open a formula update for review without changing the default branch
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        shell: bash
        run: |
          branch="sodapop-v$VERSION"
          base="$(gh api repos/VeVarunSharma/homebrew-sodapop --jq .default_branch)"
          mkdir -p tap/Formula
          cp publication/homebrew/Formula/sodapop.rb tap/Formula/sodapop.rb
          cd tap
          git checkout -b "$branch"
          git add -- Formula/sodapop.rb
          if git diff --cached --quiet; then
            printf 'The default branch already has this exact formula.\n'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update Sodapop to $VERSION" \
            -m 'Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>'
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          gh pr create --repo VeVarunSharma/homebrew-sodapop --head "$branch" --base "$base" \
            --title "Update Sodapop to $VERSION" \
            --body "Generated from the verified, immutable Sodapop v$VERSION release. Review and merge before claiming the public tap is updated."

  npm-installations:
    if: needs.prepare.outputs.publish_npm == 'true'
    needs: [prepare, npm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: macos-15-intel
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SODAPOP_LIVE_QUALIFY: '0'
      SODAPOP_RUNTIME_SMOKE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: approved-channel-inputs
          path: publication
      - name: Install from the public registry without preinstalled local payloads
        shell: bash
        run: |
          helper="$RUNNER_TEMP/releasectl$(go env GOEXE)"
          go build -o "$helper" ./scripts/releasectl
          export SODAPOP_RELEASECTL="$helper"
          npm run test:install --prefix npm -- --registry-install \
            --release-dir "$GITHUB_WORKSPACE/publication/release" \
            --manifest "$GITHUB_WORKSPACE/publication/release/sodapop-$VERSION-manifest.json"
