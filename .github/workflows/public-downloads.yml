name: Verify public native downloads

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published version without the v prefix
        type: string
        required: true

permissions:
  contents: read

env:
  SODAPOP_LIVE_QUALIFY: '0'
  SODAPOP_RUNTIME_SMOKE: '0'

jobs:
  download:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin/arm64
          - runner: macos-15-intel
            target: darwin/amd64
          - runner: ubuntu-24.04
            target: linux/amd64
          - runner: ubuntu-24.04-arm
            target: linux/arm64
          - runner: windows-2025
            target: windows/amd64
          - runner: windows-11-vs2026-arm
            target: windows/arm64
    runs-on: ${{ matrix.runner }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      SODAPOP_TARGET: ${{ matrix.target }}
      SODAPOP_RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert native ARM64 runner and Node
        if: endsWith(matrix.target, '/arm64')
        shell: pwsh
        run: |
          $osArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($osArchitecture -ne 'Arm64') {
            throw "Expected an ARM64 operating system, found $osArchitecture."
          }
          $nodeArchitecture = node -p "process.arch"
          if ($LASTEXITCODE -ne 0 -or $nodeArchitecture.Trim() -ne 'arm64') {
            throw "Expected native ARM64 Node.js, found $nodeArchitecture."
          }
      - name: Build native verification tools
        shell: bash
        run: |
          mkdir -p bin
          suffix="$(go env GOEXE)"
          go build -o "bin/releasectl$suffix" ./scripts/releasectl
          go build -o "bin/installcheck$suffix" ./scripts/installcheck
      - name: Download without authentication and exercise installed commands
        shell: bash
        run: |
          version="${INPUT_VERSION:-${RELEASE_TAG#v}}"
          bash scripts/test-public-download.sh "$version"
